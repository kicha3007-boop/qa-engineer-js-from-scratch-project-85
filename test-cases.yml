    - "Нажать кнопку языка условия «EN» рядом с названием задачи"
    - "Выбрать «Русский»"
  expected-result: |
    На кнопке языка условия «RU», условие выведено на русском (текст из тестовых данных), примеры solution([1, 2, 3, 4]) == 14 не изменились

