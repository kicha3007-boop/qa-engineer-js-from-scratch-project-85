---
- summary: |
    Успешный запуск тренировочной игры с ботом без регистрации
  requirement: |
    Гость может начать тренировочную игру с ботом со страницы «Your first coding battle» (/onboarding) без регистрации
  prerequisites: |
    Пользователь не авторизован (гость), открыта новая вкладка в режиме инкогнито; язык интерфейса English (по умолчанию); открыта страница https://codebattle.hexlet.io/onboarding
  test-data: |
    Язык программирования по умолчанию — JavaScript
  steps:
    - "Нажать «Start practice battle»"
  expected-result: |
    Открыта страница игры вида /games/<номер> с меткой «PRACTICE BOT · UNRATED»; слева редактор игрока «Guest NNNN» с шаблоном решения на JavaScript, справа редактор соперника «Codebot»; запущен таймер

- summary: |
    Выбор языка программирования из 17 языков перед тренировочной игрой
  requirement: |
    Перед тренировочной игрой можно выбрать язык программирования из списка поддерживаемых языков (17 языков)
  prerequisites: |
    Пользователь не авторизован (гость), открыта новая вкладка в режиме инкогнито; язык интерфейса English (по умолчанию); открыта страница https://codebattle.hexlet.io/onboarding
  test-data: |
    Ожидаемый список: C#, C++, Clojure, D, Dart, Elixir, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Swift, TypeScript, Zig
  steps:
    - "Открыть список «Which language do you want to use?»"
  expected-result: |
    В списке 17 языков из тестовых данных, по умолчанию выбран JavaScript

- summary: |
    Вывод результатов тестов после запуска неверного решения
  requirement: |
    После запуска неверного решения (Run) выводятся результаты тестов: число пройденных тестов, аргументы, ожидаемое и полученное значение каждого теста
  prerequisites: |
    Пользователь не авторизован (гость), открыта новая вкладка в режиме инкогнито; язык интерфейса English (по умолчанию); на странице https://codebattle.hexlet.io/onboarding нажата «Start practice battle», открыта страница новой тренировочной игры с ботом (задача sum_of_array_plus_one, язык JavaScript)
  test-data: |
    Код решения:
    const solution = (arr) => 0;
    module.exports = solution;
  steps:
    - "Заменить код в своём редакторе на код из тестовых данных"
    - "Нажать «Run»"
  expected-result: |
    Выведено «26 of 26 tests failed», счётчик «0/26»; у теста 1 указаны Arguments [[12, -3, 0, 3]], Expected 16, Received 0

- summary: |
    Победа в игре после запуска верного решения
  requirement: |
    Решение, прошедшее все тесты, завершает игру победой игрока
  prerequisites: |
    Пользователь не авторизован (гость), открыта новая вкладка в режиме инкогнито; язык интерфейса English (по умолчанию); на странице https://codebattle.hexlet.io/onboarding нажата «Start practice battle», открыта страница новой тренировочной игры с ботом (задача sum_of_array_plus_one, язык JavaScript)
  test-data: |
    Код решения:
    const solution = (arr) => arr.reduce((acc, x) => acc + x + 1, 0);
    module.exports = solution;
  steps:
    - "Заменить код в своём редакторе на код из тестовых данных"
    - "Нажать «Run»"
  expected-result: |
    Выведено «All tests passed 26/26» и «YOU WON!»; у игрока метка «WON», у Codebot — «LOST»; появились кнопки «Rematch» и «Open history»

- summary: |
    Успешное переключение условия задачи на русский язык
  requirement: |
    Условие задачи в игре можно переключить на русский язык
  prerequisites: |
