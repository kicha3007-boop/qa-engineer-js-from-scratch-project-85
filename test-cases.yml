- summary: |
    Наблюдатель видит изменения кода игрока в реальном времени
  requirement: |
    Другой пользователь может наблюдать за игрой по её ссылке и видит изменения кода игрока в реальном времени
  prerequisites: |
    Пользователь не авторизован (гость), открыта новая вкладка в режиме инкогнито; язык интерфейса English (по умолчанию); на странице https://codebattle.hexlet.io/onboarding нажата «Start practice battle», открыта страница новой тренировочной игры с ботом (задача sum_of_array_plus_one, язык JavaScript); ссылка на игру скопирована; во втором браузере (другой профиль, тоже гость) открыта эта ссылка
  test-data: |
    Код решения:
    const solution = (arr) => arr.reduce((acc, x) => acc + x + 1, 0);
    module.exports = solution;
  steps:
    - "В первом браузере заменить код в своём редакторе на код из тестовых данных"
    - "В первом браузере нажать «Run»"
    - "Через 10 секунд посмотреть на страницу игры во втором браузере"
  expected-result: |
    Во втором браузере в редакторе игрока выведен код из тестовых данных, у игрока «WON» и «26/26», в шапке игры «GAME OVER»

